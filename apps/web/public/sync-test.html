<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawnix 多分辨率同步测试</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      font-size: 14px;
    }
    .header a { color: #4dabf7; text-decoration: none; }
    .main { display: flex; height: 100%; padding-top: 44px; }
    .column { display: flex; flex-direction: column; }
    .column.source { flex: 1.2; min-width: 0; }
    .column.receivers { flex: 1; min-width: 0; border-left: 2px solid #333; }
    .pane { position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .column.source .pane { flex: 1; }
    .column.receivers .pane { flex: 1; }
    .column.receivers .pane + .pane { border-top: 2px solid #333; }
    .label {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 5;
    }
    .label .res { color: #ffd43b; font-weight: 600; }
    iframe { display: block; border: none; background: #121212; }
    iframe.responsive { width: 100%; height: 100%; }
    .scaled-frame-wrap {
      flex: 1;
      overflow: auto;
      background: #0b0b0b;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .log {
      position: absolute;
      bottom: 8px; left: 8px; right: 8px;
      max-height: 100px;
      overflow: auto;
      background: rgba(0,0,0,0.75);
      color: #cfcfcf;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      z-index: 5;
    }
    .log-entry { margin: 2px 0; }
    .log-entry b { color: #69db7c; }
  </style>
</head>
<body>
  <div class="header">
    <div>Drawnix 多分辨率同步测试 · 在左侧源白板操作，数据同步到右侧两个不同分辨率画板</div>
    <div>地址：<input id="src-input" value="http://localhost:7200" style="width:180px; padding:2px 6px; border-radius:3px; border:none;" /> <button id="reload-btn" style="padding:2px 10px;">重新加载</button></div>
  </div>

  <div class="main">
    <!-- 左侧：源白板 -->
    <div class="column source">
      <div class="pane">
        <div class="label">源白板（操作源）<span class="res">100% × 100%</span></div>
        <iframe id="source-frame" class="responsive" allow="fullscreen"></iframe>
        <div class="log" id="source-log"></div>
      </div>
    </div>

    <!-- 右侧：两个不同分辨率接收端 -->
    <div class="column receivers">
      <div class="pane">
        <div class="label">同步画板 A（小分辨率）<span class="res">375 × 667</span></div>
        <div class="scaled-frame-wrap">
          <iframe id="receiver-a-frame" width="375" height="667" allow="fullscreen"></iframe>
        </div>
        <div class="log" id="receiver-a-log"></div>
      </div>
      <div class="pane">
        <div class="label">同步画板 B（大分辨率）<span class="res">1280 × 720</span></div>
        <div class="scaled-frame-wrap">
          <iframe id="receiver-b-frame" width="1280" height="720" allow="fullscreen"></iframe>
        </div>
        <div class="log" id="receiver-b-log"></div>
      </div>
    </div>
  </div>

  <script>
    const sourceFrame = document.getElementById('source-frame');
    const receiverAFrame = document.getElementById('receiver-a-frame');
    const receiverBFrame = document.getElementById('receiver-b-frame');
    const sourceLog = document.getElementById('source-log');
    const receiverALog = document.getElementById('receiver-a-log');
    const receiverBLog = document.getElementById('receiver-b-log');
    const srcInput = document.getElementById('src-input');
    const reloadBtn = document.getElementById('reload-btn');

    function setSrc() {
      const src = srcInput.value || 'http://localhost:4200';
      sourceFrame.src = src;
      receiverAFrame.src = src;
      receiverBFrame.src = src;
    }
    setSrc();
    reloadBtn.addEventListener('click', setSrc);

    function appendLog(el, text, bold) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      if (bold) div.innerHTML = '<b>' + text + '</b>';
      else div.textContent = text;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      while (el.children.length > 30) {
        el.removeChild(el.firstChild);
      }
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      // 来自源白板
      if (event.source === sourceFrame.contentWindow) {
        if (data.type === 'drawnix:loaded') {
          appendLog(sourceLog, '源白板加载完成', true);
        } else if (data.type === 'drawnix:change') {
          const opsCount = (data.payload?.operations?.length || 0);
          appendLog(sourceLog, '源白板产生 change（operations: ' + opsCount + '）→ 转发给 A、B');
          receiverAFrame.contentWindow.postMessage(data, '*');
          receiverBFrame.contentWindow.postMessage(data, '*');
        }
        return;
      }

      // 来自同步画板 A
      if (event.source === receiverAFrame.contentWindow) {
        if (data.type === 'drawnix:loaded') {
          appendLog(receiverALog, '同步画板 A 加载完成', true);
        } else if (data.type === 'drawnix:change') {
          appendLog(receiverALog, 'A 收到 change（operations: ' + (data.payload?.operations?.length || 0) + '）');
        }
        return;
      }

      // 来自同步画板 B
      if (event.source === receiverBFrame.contentWindow) {
        if (data.type === 'drawnix:loaded') {
          appendLog(receiverBLog, '同步画板 B 加载完成', true);
        } else if (data.type === 'drawnix:change') {
          appendLog(receiverBLog, 'B 收到 change（operations: ' + (data.payload?.operations?.length || 0) + '）');
        }
        return;
      }
    });
  </script>
</body>
</html>
